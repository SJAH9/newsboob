name: First release

on:
  push:
    paths:
      - ".github/workflows/release.yml"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch tuner from live site
        run: |
          curl -fsSL -o newsboob.html https://sidhubbard.com/newsboob/
          git config user.name "SJAH9"
          git config user.email "research@sidhubbard.com"
          git add newsboob.html README.md
          if git diff --cached --quiet; then
            echo "already current"
          else
            git commit -m "Sync tuner from sidhubbard.com/newsboob"
            git push
          fi
      - name: Publish v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: NEWSBOOB v1.1.0
          make_latest: true
          files: newsboob.html
          body: |
            Station lineup: DW, F24, EUR, SKY, Fox, CBS, ABC.
            BBC and CNN removed. Euronews added (native HLS).

            Live: https://sidhubbard.com/newsboob
