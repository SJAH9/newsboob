name: Deploy standalone player to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - newsboob.html
      - player.js
      - hls.min.js
      - donate.html
      - bitcoin-donation.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble standalone site
        run: |
          mkdir _site
          cp newsboob.html _site/index.html
          cp player.js hls.min.js donate.html bitcoin-donation.svg _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
