<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NEWSBOOB — world news tuner</title>
  <meta name="description" content="A standalone news stream viewer. One player, one dial. No account, no extra ads." />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="canonical" href="https://sidhubbard.com/newsboob/" />
  <script>
    (() => {
      let mode = "auto";
      try {
        const stored = localStorage.getItem("sid-theme-mode");
        if (["auto", "light", "dark"].includes(stored)) mode = stored;
      } catch {}
      const hour = new Date().getHours();
      document.documentElement.dataset.theme = mode === "auto"
        ? (hour >= 7 && hour < 19 ? "light" : "dark")
        : mode;
      document.documentElement.dataset.themeMode = mode;
    })();
  </script>
  <script src="hls.min.js"></script>
  <style>
    .desk, .carto {
      --bg: #050608;
      --panel: #08090c;
      --line: #1c2430;
      --text: #c8d0d8;
      --dim: #5c6773;
      --cyan: #3dffd2;
      --mag: #ff2d95;
      --screen: #000;
      --font: ui-monospace, Menlo, Consolas, monospace;
    }

    .desk, .desk * { box-sizing: border-box; }
    .desk * { margin: 0; padding: 0; }
    html { height: 100%; }
    body.newsboob-page {
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #050608;
      color: #c8d0d8;
    }
    body.newsboob-page p:not(.eyebrow) {
      color: inherit;
      font-size: inherit;
      margin-top: 0;
      max-width: none;
    }

    .carto {
      position: fixed;
      inset: -30%;
      top: -30%;
      z-index: 0;
      pointer-events: none;
      background-color: var(--bg);
      background-image:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent calc(3.2vmin - 1px),
          rgba(61,255,210,.07) calc(3.2vmin - 1px),
          rgba(61,255,210,.07) 3.2vmin
        ),
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(4.8vmin - 1px),
          rgba(61,255,210,.06) calc(4.8vmin - 1px),
          rgba(61,255,210,.06) 4.8vmin
        ),
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent calc(16vmin - 1px),
          rgba(61,255,210,.16) calc(16vmin - 1px),
          rgba(61,255,210,.16) 16vmin
        ),
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(24vmin - 1px),
          rgba(61,255,210,.14) calc(24vmin - 1px),
          rgba(61,255,210,.14) 24vmin
        );
      animation: carto-drift 80s linear infinite;
    }
    .carto::before,
    .carto::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .carto::before {
      background:
        linear-gradient(to bottom, transparent 49.85%, rgba(255,45,149,.22) 49.85%, rgba(255,45,149,.22) 50.15%, transparent 50.15%),
        linear-gradient(to right, transparent 49.9%, rgba(61,255,210,.2) 49.9%, rgba(61,255,210,.2) 50.1%, transparent 50.1%);
      animation: carto-drift-2 120s linear infinite reverse;
    }
    .carto::after {
      background-image:
        repeating-linear-gradient(
          to right,
          rgba(61,255,210,.12) 0 1px,
          transparent 1px 1.2vmin,
          transparent 1.2vmin 4.8vmin
        );
      background-size: 4.8vmin 0.7vmin;
      background-repeat: repeat-x;
      background-position: 0 50%;
      opacity: .45;
      animation: carto-drift 80s linear infinite;
    }
    @keyframes carto-drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-4.8vmin, -3.2vmin, 0); }
    }
    @keyframes carto-drift-2 {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(4.8vmin, 3.2vmin, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .carto, .carto::before, .carto::after { animation: none; }
    }

    .desk {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      color: var(--text);
      font-family: var(--font);
      font-size: clamp(11px, 1.05vw + 0.35vh, 14px);
      padding: 8px 8px 4px;
    }
    body.newsboob-page .site-footer {
      flex: 0 0 auto;
      position: relative;
      z-index: 20;
      margin-top: 0;
      padding-top: 12px;
      padding-bottom: 12px;
    }
    body.newsboob-page .persistent-audio-player,
    body.newsboob-page.has-persistent-audio-player .persistent-audio-player {
      display: none !important;
    }
    body.newsboob-page.has-persistent-audio-player {
      padding-bottom: 0 !important;
    }
    body.newsboob-page .nav-links {
      overflow: visible;
    }

    .set {
      --dial: clamp(120px, 22vmin, 240px);
      width: 100%;
      height: 100%;
      min-height: 0;
      background: rgba(8, 9, 12, .72);
      border: 1px solid var(--line);
      padding: clamp(8px, 1.2vw, 16px);
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1vw, 14px);
      overflow: hidden;
    }

    .set:fullscreen,
    .set:-webkit-full-screen {
      background: var(--panel);
      border: 0;
      height: 100vh;
      max-width: none;
      overflow: hidden;
      padding: clamp(8px, 1.2vw, 16px);
      width: 100vw;
    }

    .plate {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 0 0 clamp(8px, 1vw, 12px);
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      font-size: clamp(13px, 1.6vw, 18px);
      font-weight: 500;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .wordmark i {
      font-style: normal;
      color: var(--text);
    }
    .wordmark .chan {
      font-style: normal;
      font-weight: 400;
      color: var(--text);
      letter-spacing: .14em;
    }
    .wordmark .chan:empty { display: none; }

    .model {
      font-size: clamp(9px, 0.9vw, 11px);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .body {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(var(--dial), 0.28fr) minmax(0, 1fr);
      gap: clamp(8px, 1.2vw, 16px);
      align-items: stretch;
    }
    .body.solo {
      grid-template-columns: minmax(0, 1fr);
    }
    .body.solo .tuner { display: none; }

    .tuner {
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: clamp(4px, 0.8vh, 10px);
      overflow: hidden;
    }

    .dial-wrap {
      display: none;
      width: var(--dial);
      height: var(--dial);
      flex: 0 0 auto;
      position: relative;
      user-select: none;
      touch-action: none;
      cursor: grab;
    }
    .dial-wrap:active { cursor: grabbing; }
    .dial-wrap:active .pointer { transition: none; }

    .dial-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--line);
    }

    .dial-face {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background: rgba(6, 7, 10, .62);
      border: 1px solid #151b24;
    }

    .pointer {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 42%;
      margin-left: -1px;
      margin-top: -42%;
      transform-origin: 50% 100%;
      transform: rotate(0deg);
      transition: transform .2s ease;
      z-index: 3;
      pointer-events: none;
    }
    .pointer::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12%;
      width: 2px;
      height: 76%;
      background: var(--cyan);
      box-shadow: 0 0 8px rgba(61,255,210,.5);
    }
    .hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6%;
      height: 6%;
      min-width: 10px;
      min-height: 10px;
      margin: 0;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--cyan);
      z-index: 4;
      pointer-events: none;
    }
    .hub::after { display: none; }

    .clock {
      position: absolute;
      left: 50%;
      top: 72%;
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
      font-size: clamp(11px, var(--dial) * 0.088, 17px);
      font-weight: 500;
      letter-spacing: .16em;
      font-variant-numeric: tabular-nums;
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(61,255,210,.4);
    }

    .tick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-origin: 0 0;
    }
    .tick span {
      position: absolute;
      top: calc(var(--dial) * -0.475);
      left: calc(var(--dial) * -0.125);
      width: calc(var(--dial) * 0.25);
      text-align: center;
      font-size: clamp(9px, var(--dial) * 0.048, 12px);
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--dim);
      cursor: pointer;
      z-index: 6;
      pointer-events: auto;
    }
    .tick.on span {
      color: var(--cyan);
    }
    .tick i {
      position: absolute;
      top: calc(var(--dial) * -0.395);
      left: 0;
      width: 1px;
      height: calc(var(--dial) * 0.035);
      background: var(--line);
      pointer-events: none;
    }
    .tick.on i { background: var(--cyan); }

    .readout {
      width: 100%;
      max-width: calc(var(--dial) + 24px);
      border: 1px solid var(--line);
      background: rgba(8, 9, 12, .45);
      padding: clamp(6px, 0.9vh, 10px) clamp(8px, 1vw, 12px);
      flex: 0 0 auto;
    }
    .readout .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
    }
    .call {
      color: var(--cyan);
      font-size: clamp(12px, 1.2vw, 15px);
      letter-spacing: .18em;
    }
    .live {
      color: var(--mag);
      font-size: clamp(9px, 0.85vw, 10px);
      letter-spacing: .22em;
      animation: blink 1.6s infinite;
    }
    .live.off { color: #3a2430; animation: none; }
    .sub {
      margin-top: 6px;
      color: var(--dim);
      font-size: clamp(9px, 0.9vw, 11px);
      letter-spacing: .06em;
      min-height: 1.3em;
    }

    @keyframes blink {
      0%, 70% { opacity: 1; }
      85% { opacity: .2; }
      100% { opacity: 1; }
    }

    .keys {
      width: 100%;
      max-width: calc(var(--dial) + 24px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      flex: 0 0 auto;
    }
    .keys button, .bezel-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font: 500 clamp(9px, 0.95vw, 11px)/1 var(--font);
      letter-spacing: .16em;
      text-transform: uppercase;
      padding: clamp(7px, 1vh, 10px) 8px;
      cursor: pointer;
    }
    .keys button:hover, .bezel-btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .keys button:active, .bezel-btn:active { background: #0c1210; }

    .tv {
      border: 1px solid var(--line);
      background: rgba(8, 9, 12, .35);
      padding: clamp(4px, 0.7vw, 8px);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      height: 100%;
    }

    .screen-frame {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      background: var(--screen);
      overflow: hidden;
      border: 1px solid #11161c;
    }

    .previews {
      display: none;
      width: 100%;
      max-width: calc(var(--dial) + 24px);
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: clamp(3px, 0.5vw, 6px);
    }
    .previews.on { display: grid; }
    .preview {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 0;
      font: inherit;
      color: inherit;
      border: 0;
      background: transparent;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .preview video {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      object-fit: cover;
      display: block;
      border: 1px solid var(--line);
      background: #000;
    }
    .preview:hover video { border-color: var(--cyan); }
    .preview .tag {
      flex: 0 0 auto;
      font-size: clamp(8px, 0.8vw, 10px);
      letter-spacing: .16em;
      color: var(--cyan);
      line-height: 1.2;
      text-align: left;
      pointer-events: none;
    }
    .preview.live-off .tag { color: var(--dim); }

    #stage, #yt, #hlsVideo, .veil, .scan {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #hlsVideo { background: #000; object-fit: contain; }
    #yt { border: 0; }
    .scan {
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(61,255,210,.03) 0 1px,
        transparent 1px 4px
      );
      z-index: 4;
    }
    .glass { display: none; }

    .veil {
      z-index: 8;
      display: grid;
      place-items: center;
      background: rgba(5, 6, 8, .78);
      text-align: left;
      padding: clamp(16px, 3vw, 28px);
    }
    .veil.hidden { display: none; }
    .veil h2 {
      font-size: clamp(12px, 1.4vw, 14px);
      font-weight: 500;
      letter-spacing: .28em;
      color: var(--cyan);
      margin-bottom: 10px;
    }
    .veil p {
      max-width: 42ch;
      color: var(--dim);
      font-size: clamp(11px, 1.1vw, 13px);
      line-height: 1.55;
      margin-bottom: 20px;
    }
    .power {
      appearance: none;
      border: 1px solid var(--cyan);
      background: transparent;
      width: auto;
      height: auto;
      border-radius: 0;
      cursor: pointer;
      padding: clamp(8px, 1.2vh, 10px) clamp(12px, 1.6vw, 18px);
      color: var(--cyan);
      font: 500 clamp(9px, 0.95vw, 11px)/1 var(--font);
      letter-spacing: .22em;
      box-shadow: none;
    }
    .power:hover { background: rgba(61,255,210,.08); }

    .under {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: clamp(6px, 1vh, 10px) 2px 0;
    }
    .leds {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(8px, 0.85vw, 10px);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 0;
      background: #1a2028;
    }
    .dot.on { background: var(--cyan); }
    .dot.warn { background: var(--mag); }

    .bezel-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .vol {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--dim);
      font-size: clamp(8px, 0.85vw, 10px);
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .vol input {
      accent-color: var(--cyan);
      width: clamp(56px, 8vw, 96px);
    }

    @media (max-width: 860px) {
      .set { --dial: clamp(120px, 42vmin, 220px); }
      .plate { flex-wrap: wrap; }
      .body {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
      }
      .body.solo {
        grid-template-rows: minmax(0, 1fr);
      }
      .tuner {
        flex-direction: column;
        flex-wrap: nowrap;
        justify-content: flex-start;
      }
      .readout, .keys, .previews { max-width: min(100%, calc(var(--dial) + 48px)); }
      .under { flex-wrap: wrap; }
    }

    @media (max-height: 520px) {
      .set { --dial: clamp(110px, 34vmin, 180px); }
    }
  </style>
</head>
<body class="newsboob-page">
  <div class="carto" aria-hidden="true"></div>
  <div class="desk">
    <div class="set">
      <header class="plate">
        <div class="wordmark">NEWS<i>BOOB</i><span class="chan" id="titleChan"></span></div>
        <div class="model">International News</div>
      </header>

      <div class="body" id="layout">
        <aside class="tuner">
          <div class="dial-wrap" id="dial" aria-label="Station dial">
            <div class="dial-ring"></div>
            <div class="dial-face"></div>
            <div id="ticks"></div>
            <div class="pointer" id="pointer"></div>
            <div class="hub"></div>
            <div class="clock" id="clock" aria-hidden="true">00:00:00</div>
          </div>

          <div class="previews" id="previews"></div>

          <div class="readout" aria-live="polite">
            <div class="row">
              <span class="call" id="call">STANDBY</span>
              <span class="live off" id="live">LIVE</span>
            </div>
            <div class="sub" id="sub">Power on, then turn the dial.</div>
          </div>

          <div class="keys">
            <button type="button" id="prevBtn">Prev</button>
            <button type="button" id="nextBtn">Next</button>
          </div>
        </aside>

        <section class="tv">
          <div class="screen-frame">
            <div id="stage">
              <video id="hlsVideo" playsinline></video>
              <div id="yt"></div>
            </div>
            <div class="scan"></div>
            <div class="glass"></div>
            <div class="veil" id="veil">
              <div>
                <h2>NEWSBOOB</h2>
                <p>One player. Ten public HLS feeds. No account. No YouTube. No chrome ads.</p>
                <button class="power" id="power" type="button">POWER</button>
              </div>
            </div>
            <div class="veil hidden" id="offair">
              <div>
                <h2 id="offTitle">No lock</h2>
                <p id="offCopy">Could not open this public feed. Try the official live page.</p>
                <a class="bezel-btn" id="offLink" href="#" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">Open official live</a>
              </div>
            </div>
          </div>
          <div class="under">
            <div class="leds">
              <button class="bezel-btn" id="panelBtn" type="button" aria-label="Hide tuner panel" title="Hide tuner panel">&lt;&lt;</button>
              <span class="dot" id="pwrLed"></span>
              <span id="srcLabel">off</span>
            </div>
            <div class="bezel-controls">
              <label class="vol">Vol
                <input id="vol" type="range" min="0" max="100" value="80" />
              </label>
              <button class="bezel-btn" id="muteBtn" type="button">Mute</button>
              <button class="bezel-btn" id="reloadBtn" type="button">Reload</button>
              <button class="bezel-btn" id="fsBtn" type="button">Full</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script>
    const STATIONS = [
      {
        id: "dw", label: "DW", name: "Deutsche Welle",
        hls: [
          "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8",
          "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/master.m3u8"
        ],
        site: "https://www.dw.com/en/live-tv/channel-english"
      },
      {
        id: "f24", label: "F24", name: "France 24",
        hls: [
          "https://live.france24.com/hls/live/2037218-b/F24_EN_HI_HLS/master_5000.m3u8",
          "https://live.france24.com/hls/live/2037218/F24_EN_HI_HLS/master_5000.m3u8"
        ],
        site: "https://www.france24.com/en/live"
      },
      {
        id: "eur", label: "EUR", name: "Euronews",
        hls: [
          "https://cdn-euronews.akamaized.net/live/eds/euronews-en/25002/index.m3u8"
        ],
        site: "https://www.euronews.com/live"
      },
      {
        id: "rt", label: "RT", name: "RT News",
        hls: [
          "https://rt-glb.rttv.com/dvr/rtnews/playlist.m3u8",
          "https://rt-glb.rttv.com/live/rtnews/playlist.m3u8"
        ],
        site: "https://www.rt.com/"
      },
      {

    const el = {
      dial: document.getElementById("dial"),
      ticks: document.getElementById("ticks"),
      pointer: document.getElementById("pointer"),
      call: document.getElementById("call"),
      live: document.getElementById("live"),
      sub: document.getElementById("sub"),
      veil: document.getElementById("veil"),
      offair: document.getElementById("offair"),
      offTitle: document.getElementById("offTitle"),
      offCopy: document.getElementById("offCopy"),
      offLink: document.getElementById("offLink"),
      power: document.getElementById("power"),
      pwrLed: document.getElementById("pwrLed"),
      srcLabel: document.getElementById("srcLabel"),
      video: document.getElementById("hlsVideo"),
      ytHost: document.getElementById("yt"),
      vol: document.getElementById("vol"),
      muteBtn: document.getElementById("muteBtn"),
      fsBtn: document.getElementById("fsBtn"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      panelBtn: document.getElementById("panelBtn"),
      reloadBtn: document.getElementById("reloadBtn"),
      layout: document.getElementById("layout"),
      previews: document.getElementById("previews"),
      titleChan: document.getElementById("titleChan"),
      clock: document.getElementById("clock")
    };

    let on = false;
    let index = Number(localStorage.getItem("newsboob.station") || 0) % STATIONS.length;
    let locked = -1;
    let token = 0;
    let hls = null;
    const previewPlayers = new Map();
    let muted = false;
    let panelOpen = localStorage.getItem("newsboob.panel") !== "0";
    let dragging = false;
    let dragIndex = index;
    const STEP = 360 / STATIONS.length;
    let needle = index * STEP;

    STATIONS.forEach((s, i) => {
      const tick = document.createElement("div");
      tick.className = "tick";
      tick.style.transform = `rotate(${i * STEP}deg)`;
      tick.innerHTML = `<i></i><span style="transform:rotate(${-i * STEP}deg)">${s.label}</span>`;
      tick.querySelector("span").addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        e.preventDefault();
        go(i);
      });
      el.ticks.appendChild(tick);
    });

    function setPointer(i) {
      const target = i * STEP;
      const delta = ((target - needle + 540) % 360) - 180;
      needle += delta;
      el.pointer.style.transform = `rotate(${needle}deg)`;
      [...el.ticks.children].forEach((t, n) => t.classList.toggle("on", n === i));
    }

    function stopHls() {
      if (hls) { hls.destroy(); hls = null; }
      el.video.onloadedmetadata = null;
      el.video.onerror = null;
      el.video.pause();
      el.video.removeAttribute("src");
      el.video.load();
      el.video.style.display = "none";
    }

    function stopYt() {
      el.ytHost.innerHTML = "";
      el.ytHost.style.display = "none";
    }

    function hlsList(station) {
      if (!station.hls) return [];
      return Array.isArray(station.hls) ? station.hls : [station.hls];
    }

    function hlsPreviewConfig() {
      return {
        enableWorker: true,
        lowLatencyMode: false,
        capLevelToPlayerSize: true,
        maxBufferLength: 6,
        maxMaxBufferLength: 10,
        startLevel: 0,
        xhrSetup(xhr) {
          try { xhr.withCredentials = false; } catch (_) {}
        }
      };
    }

    function attachPreviewStream(video, url) {
      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.play().catch(() => {});
        return { native: true };
      }
      if (window.Hls && Hls.isSupported()) {
        const player = new Hls(hlsPreviewConfig());
        player.on(Hls.Events.MANIFEST_PARSED, () => {
          if (player.levels && player.levels.length) player.currentLevel = 0;
          video.play().catch(() => {});
        });
        player.loadSource(url);
        player.attachMedia(video);
        return { hls: player };
      }
      return null;
    }

    function killPreview(id) {
      const rec = previewPlayers.get(id);
      if (!rec) return;
      if (rec.hls) {
        try { rec.hls.destroy(); } catch (_) {}
      }
      if (rec.video) {
        rec.video.pause();
        rec.video.removeAttribute("src");
        rec.video.load();
      }
      rec.tile.remove();
      previewPlayers.delete(id);
    }

    function startPreview(station, stationIndex, url, urlIndex) {
      if (previewPlayers.has(station.id)) return;
      const tile = document.createElement("button");
      tile.type = "button";
      tile.className = "preview";
      tile.setAttribute("aria-label", "Monitor " + station.name);
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = station.name;
      tile.addEventListener("click", () => go(stationIndex));
      el.previews.appendChild(tile);

      if (!url) {
        tile.classList.add("live-off");
        tile.appendChild(tag);
        previewPlayers.set(station.id, { video: null, tile, hls: null });
        return;
      }

      const video = document.createElement("video");
      video.muted = true;
      video.playsInline = true;
      video.autoplay = true;
      video.setAttribute("muted", "");
      video.setAttribute("playsinline", "");
      tile.appendChild(video);
      tile.appendChild(tag);

      const fail = () => {
        if (!previewPlayers.has(station.id)) return;
        const urls = hlsList(station);
        if (urlIndex + 1 < urls.length) {
          killPreview(station.id);
          startPreview(station, stationIndex, urls[urlIndex + 1], urlIndex + 1);
          return;
        }
        tile.classList.add("live-off");
      };

      const handle = attachPreviewStream(video, url);
      if (!handle) {
        tile.classList.add("live-off");
        previewPlayers.set(station.id, { video, tile, hls: null });
        return;
      }
      if (handle.hls) {
        handle.hls.on(Hls.Events.ERROR, (_, data) => {
          if (data && data.fatal) fail();
        });
      }
      video.addEventListener("error", fail);
      previewPlayers.set(station.id, { video, tile, hls: handle.hls || null });
    }

    function syncPreviews() {
      if (!on || !panelOpen) {
        [...previewPlayers.keys()].forEach(killPreview);
        el.previews.classList.remove("on");
        return;
      }
      const want = STATIONS
        .map((s, i) => ({
          s,
          i,
          urls: hlsList(s)
        }))
        .filter((row) => row.i !== index);
      [...previewPlayers.keys()].forEach((id) => {
        if (!want.some((row) => row.s.id === id)) killPreview(id);
      });
      want.forEach(({ s, i, urls }) => {
        if (!previewPlayers.has(s.id)) startPreview(s, i, urls[0] || null, 0);
        else el.previews.appendChild(previewPlayers.get(s.id).tile);
      });
      el.previews.classList.toggle("on", previewPlayers.size > 0);
    }

    function setStatus(src, detail) {
      const s = STATIONS[index];
      el.call.textContent = on ? s.label : "STANDBY";
      el.live.classList.toggle("off", !on);
      el.sub.textContent = detail || s.name;
      el.srcLabel.textContent = on ? src : "off";
      el.pwrLed.className = "dot" + (on ? " on" : "");
      el.titleChan.textContent = on ? ": " + s.name : "";
    }

    function playHls(url, gen, forceHlsJs) {
      return new Promise((resolve, reject) => {
        stopYt();
        hideOffAir();
        el.video.style.display = "block";
        el.video.playsInline = true;
        el.video.autoplay = true;
        el.video.muted = muted;
        el.video.volume = Number(el.vol.value) / 100;

        let settled = false;
        let recoveries = 0;
        const fail = (err) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (gen !== token) return reject(err);
          stopHls();
          reject(err || new Error("hls"));
        };
        const keepAlive = (data) => {
          if (!hls) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            hls.startLoad();
            return;
          }
          if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            recoveries += 1;
            if (recoveries % 3 === 0) hls.swapAudioCodec();
            hls.recoverMediaError();
          }
        };
        const startPlayback = () => {
          const done = () => resolve("hls");
          el.video.play().then(done).catch(() => {
            el.video.muted = true;
            muted = true;
            applyVolume();
            el.video.play().then(done).catch(done);
          });
        };
        const ok = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (gen !== token) return;
          startPlayback();
        };
        const timer = setTimeout(() => fail(new Error("timeout")), 14000);

        const hlsJsSupported = !!(window.Hls && Hls.isSupported());
        if (el.video.canPlayType("application/vnd.apple.mpegurl") && !(forceHlsJs && hlsJsSupported)) {
          el.video.src = url;
          el.video.onloadedmetadata = ok;
          el.video.onerror = () => fail(new Error("video"));
          return;
        }
        if (hlsJsSupported) {
          hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            capLevelToPlayerSize: false,
            startLevel: -1,
            abrEwmaDefaultEstimate: 8000000,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 8,
            maxBufferLength: 24,
            maxMaxBufferLength: 48,
            backBufferLength: 12,
            manifestLoadingTimeOut: 15000,
            fragLoadingTimeOut: 20000,
            xhrSetup(xhr) {
              try { xhr.withCredentials = false; } catch (_) {}
            }
          });
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            const levels = hls.levels || [];
            let best = 0;
            levels.forEach((lvl, i) => {
              const h0 = levels[best].height || 0;
              const h1 = lvl.height || 0;
              if (h1 > h0 || (h1 === h0 && (lvl.bitrate || 0) > (levels[best].bitrate || 0))) best = i;
            });
            hls.autoLevelCapping = -1;
            hls.startLevel = best;
            hls.nextLevel = best;
            ok();
          });
          hls.on(Hls.Events.ERROR, (_, data) => {
            if (!data.fatal) {
              if (data.details === "bufferStalledError") hls.startLoad();
              return;
            }
            if (settled) {
              keepAlive(data);
              return;
            }
            if (recoveries < 3 && data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              recoveries += 1;
              hls.startLoad();
              return;
            }
            if (recoveries < 3 && data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              recoveries += 1;
              hls.recoverMediaError();
              return;
            }
            fail(data);
          });
          hls.loadSource(url);
          hls.attachMedia(el.video);
          return;
        }
        fail(new Error("no hls"));
      });
    }

    async function playNative(station, gen) {
      const urls = hlsList(station);
      let last = null;
      for (const url of urls) {
        if (gen !== token) return;
        try {
          await playHls(url, gen, station.forceHlsJs);
          return "hls";
        } catch (err) {
          last = err;
        }
      }
      throw last || new Error("hls");
    }

    function showOffAir(station, detail) {
      stopHls();
      stopYt();
      el.offair.classList.remove("hidden");
      el.offTitle.textContent = station.label;
      el.offCopy.textContent = detail ||
        (station.name + " native stream did not lock. Open their live page if this feed is down.");
      el.offLink.href = station.site;
    }

    function hideOffAir() {
      el.offair.classList.add("hidden");
    }

    async function go(i) {
      i = (i + STATIONS.length) % STATIONS.length;
      index = i;
      localStorage.setItem("newsboob.station", String(index));
      setPointer(index);
      if (!on) {
        powerOn();
      }
      await lock(index);
    }

    async function lock(i) {
      if (on) syncPreviews();
      if (locked === i && hls && el.offair.classList.contains("hidden")) return;
      const s = STATIONS[i];
      const gen = ++token;
      locked = i;
      hideOffAir();
      setStatus("tuning", s.name + " · locking signal…");
      el.pwrLed.className = "dot warn";

      if (hlsList(s).length) {
        try {
          await playNative(s, gen);
          if (gen !== token) return;
          setStatus("source stream", s.name);
          applyVolume();
          return;
        } catch (_) {
          if (gen !== token) return;
          showOffAir(s, s.name + " native stream did not lock. Use the official live page.");
          setStatus("no lock", s.name);
          return;
        }
      }

      showOffAir(s, s.name + " has no public HLS stream we can play in this tuner.");
      setStatus("no lock", s.name);
    }

    function powerOn() {
      on = true;
      el.veil.classList.add("hidden");
      el.pwrLed.className = "dot on";
      if (panelOpen) syncPreviews();
    }

    function setPanel(open) {
      panelOpen = open;
      localStorage.setItem("newsboob.panel", open ? "1" : "0");
      el.layout.classList.toggle("solo", !open);
      el.panelBtn.textContent = open ? "<<" : ">>";
      el.panelBtn.setAttribute("aria-label", open ? "Hide tuner panel" : "Show tuner panel");
      el.panelBtn.title = open ? "Hide tuner panel" : "Show tuner panel";
      if (!on) return;
      if (open) syncPreviews();
      else {
        [...previewPlayers.keys()].forEach(killPreview);
        el.previews.classList.remove("on");
      }
    }

    async function reloadStream() {
      if (!on) {
        go(index);
        return;
      }
      locked = -1;
      stopHls();
      stopYt();
      await lock(index);
    }

    let stallTicks = 0;
    let lastMediaTime = -1;
    let reloading = false;
    setInterval(() => {
      if (!on || reloading || document.hidden) {
        stallTicks = 0;
        return;
      }
      if (el.offair && !el.offair.classList.contains("hidden")) {
        stallTicks = 0;
        return;
      }
      const v = el.video;
      if (!v || v.style.display === "none" || v.paused) {
        stallTicks = 0;
        return;
      }
      if (v.readyState < 2 || v.currentTime <= 0) {
        stallTicks = 0;
        return;
      }
      const t = v.currentTime;
      if (t <= lastMediaTime + 0.05) stallTicks += 1;
      else stallTicks = 0;
      lastMediaTime = t;
      if (stallTicks < 5) return;
      stallTicks = 0;
      reloading = true;
      Promise.resolve(reloadStream()).finally(() => { reloading = false; });
    }, 2000);

    function applyVolume() {
      const v = Number(el.vol.value);
      el.video.volume = v / 100;
      el.video.muted = muted;
      el.muteBtn.textContent = muted ? "Unmute" : "Mute";
      if (on && el.video.style.display !== "none" && el.video.paused) {
        el.video.play().catch(() => {});
      }
    }

    function angleIndex(evt) {
      const r = el.dial.getBoundingClientRect();
      const pt = evt.clientX != null ? evt : (evt.touches && evt.touches[0]);
      const x = pt.clientX - (r.left + r.width / 2);
      const y = pt.clientY - (r.top + r.height / 2);
      let deg = Math.atan2(y, x) * 180 / Math.PI + 90;
      if (deg < 0) deg += 360;
      const n = STATIONS.length;
      return ((Math.round(deg / STEP) % n) + n) % n;
    }

    el.power.addEventListener("click", () => go(index));
    el.prevBtn.addEventListener("click", () => go(index - 1));
    el.nextBtn.addEventListener("click", () => go(index + 1));
    el.vol.addEventListener("input", applyVolume);
    el.muteBtn.addEventListener("click", () => { muted = !muted; applyVolume(); });
    el.panelBtn.addEventListener("click", () => setPanel(!panelOpen));
    el.reloadBtn.addEventListener("click", () => reloadStream());
    el.video.addEventListener("pointerdown", () => {
      if (el.video.paused) el.video.play().catch(() => {});
    });
    el.fsBtn.addEventListener("click", () => {
      const frame = document.querySelector(".set");
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      if (!active) (frame.requestFullscreen || frame.webkitRequestFullscreen)?.call(frame);
      else (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    });
    function syncFullscreenLabel() {
      const active = document.fullscreenElement || document.webkitFullscreenElement;
      el.fsBtn.textContent = active ? "Exit" : "Full";
      el.fsBtn.setAttribute("aria-label", active ? "Exit full screen" : "Enter full screen with NEWSBOOB frame");
    }
    document.addEventListener("fullscreenchange", syncFullscreenLabel);
    document.addEventListener("webkitfullscreenchange", syncFullscreenLabel);

    el.dial.addEventListener("pointerdown", (e) => {
      if (e.target.closest("span")) return;
      dragging = true;
      el.dial.setPointerCapture?.(e.pointerId);
      dragIndex = angleIndex(e);
      setPointer(dragIndex);
    });
    el.dial.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      dragIndex = angleIndex(e);
      setPointer(dragIndex);
    });
    el.dial.addEventListener("pointerup", () => {
      if (!dragging) return;
      dragging = false;
      go(dragIndex);
    });

    window.addEventListener("keydown", (e) => {
      if (e.target.matches("input, textarea")) return;
      if (/^[1-9]$/.test(e.key) && Number(e.key) <= STATIONS.length) go(Number(e.key) - 1);
      if (e.key === "0" && STATIONS.length >= 10) go(9);
      if (e.key === "ArrowRight" || e.key === "ArrowDown") go(index + 1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(index - 1);
      if (e.key.toLowerCase() === "m") { muted = !muted; applyVolume(); }
      if (e.key.toLowerCase() === "h") setPanel(!panelOpen);
      if (e.key === " ") {
        e.preventDefault();
        if (!on) go(index);
        else { muted = !muted; applyVolume(); }
      }
    });

    document.addEventListener("visibilitychange", () => {
      previewPlayers.forEach((rec) => {
        if (!rec.video) return;
        if (document.hidden) rec.video.pause();
        else rec.video.play().catch(() => {});
      });
    });

    function tickClock() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      el.clock.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    }
    tickClock();
    setInterval(tickClock, 1000);

    setPanel(panelOpen);
    setPointer(index);
    setStatus("off", "Power on, then turn the dial.");
  </script>
